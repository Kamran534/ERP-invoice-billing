version: 2

updates:
  # Security patches are the point; a weekly wall of minor bumps is not. Minor and
  # patch updates are grouped into one PR per ecosystem, and majors come alone so
  # they get read — this project pins majors deliberately (fastify 5, zod 4,
  # drizzle 0.44) and a silent major is exactly what should not merge.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        # ⚑ 0.x packages are excluded from the grouped PR. Under semver, a 0.x
        # minor bump is the de-facto major — 0.44 → 0.45 may break the API — but
        # Dependabot classifies it as `minor` and the `ignore` rule below, which
        # only holds back semver-majors, does not catch it. Without this exclusion
        # a potentially breaking drizzle upgrade arrives inside a PR labelled
        # "minor-and-patch" alongside genuinely routine bumps.
        #
        # Keep this list in step with the 0.x dependencies in the workspace:
        #   node -e "…" — see docs/Git and CI.md, 'Reviewing Dependabot PRs'
        exclude-patterns:
          - drizzle-orm
          - drizzle-kit
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies, ci]

  # postgres / redis / mailpit / node base images
  - package-ecosystem: docker
    directories:
      - /docker
      - /
    schedule:
      interval: monthly
    labels: [dependencies, docker]
