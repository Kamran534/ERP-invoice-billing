global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    env: local

scrape_configs:
  - job_name: billing-api
    metrics_path: /metrics
    # Docker DNS resolves the service name; with `--scale api=3` this single
    # entry still only hits one replica. For real multi-replica scraping, use
    # dns_sd_configs with tasks.api (swarm) or a service-discovery target.
    static_configs:
      - targets: ["api:3000"]
        labels:
          service: api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

